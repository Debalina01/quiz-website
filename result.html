
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quizly - Quiz Result</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav class="navbar">
    <div class="nav-brand">

      <svg class="quizly-logo-icon" width="30" height="30"
        viewBox="0 0 32 32" fill="none"
        xmlns="http://www.w3.org/2000/svg">

        <rect width="32" height="32" rx="9"
          fill="url(#nav-quizly-grad)"/>

        <path
          d="M16 6.5C12.41 6.5 9.5 9.41 9.5 13C9.5 13.55 9.95 14 10.5 14C11.05 14 11.5 13.55 11.5 13C11.5 10.51 13.51 8.5 16 8.5C18.49 8.5 20.5 10.51 20.5 13C20.5 15.02 19.12 16.19 17.69 17.41C16.32 18.58 15 19.78 15 22C15 22.55 15.45 23 16 23C16.55 23 17 22.55 17 22C17 20.42 18.06 19.46 19.31 18.39C20.88 17.05 22.5 15.53 22.5 13C22.5 9.41 19.59 6.5 16 6.5ZM16 24.5C15.17 24.5 14.5 25.17 14.5 26C14.5 26.83 15.17 27.5 16 27.5C16.83 27.5 17.5 26.83 17.5 26C17.5 25.17 16.83 25.5 16 24.5Z"
          fill="white"/>

        <defs>
          <linearGradient id="nav-quizly-grad"
            x1="0" y1="0" x2="32" y2="32"
            gradientUnits="userSpaceOnUse">

            <stop stop-color="#8B5CF6"/>
            <stop offset="1" stop-color="#6D28D9"/>

          </linearGradient>
        </defs>

      </svg>

      <span class="logo">Quizly</span>

    </div>
  </nav>


  <main class="container">

    <div class="card result-card">

      <div class="result-badge-icon">

        <svg width="36" height="36"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#7C3AED"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true">

          <circle cx="12" cy="8" r="6"></circle>

          <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88">
          </polyline>

        </svg>

      </div>


      <h1 class="title">Quiz Result</h1>

      <p class="subtitle">
        Here is your performance summary
      </p>


      <div class="score-banner">
        <span class="score-banner-label">
          Final Score
        </span>
        <div class="score-display-row">
          <span class="result-value highlight" id="resultScore">0</span>
        </div>
        <span class="score-percentage-badge" id="resultPercentage">0%</span>
        <p class="score-feedback-text" id="resultFeedback">Well done!</p>
      </div>


      <div class="result-details">

        <div class="result-item">
          <span class="result-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            User ID:
          </span>
          <span class="result-value" id="resultUserId">
            --
          </span>
        </div>

        <div class="result-item">
          <span class="result-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>
            Total Questions:
          </span>
          <span class="result-value" id="resultTotal">
            0
          </span>
        </div>

        <div class="result-item">
          <span class="result-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            Correct Answers:
          </span>
          <span class="result-value text-success" id="resultCorrect">
            0
          </span>
        </div>

        <div class="result-item">
          <span class="result-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            Incorrect Answers:
          </span>
          <span class="result-value text-danger" id="resultIncorrect">
            0
          </span>
        </div>

        <div class="result-item">
          <span class="result-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            Accuracy:
          </span>
          <span class="result-value" id="resultAccuracy">
            0%
          </span>
        </div>

      </div>


      <button
        class="btn btn-primary"
        onclick="handleRestartQuiz()">
        Restart Quiz
      </button>

    </div>

  </main>


  <script src="script.js"></script>

</body>
</html>
