
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quizly - Quiz in Progress</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav class="navbar">
    <div class="nav-brand">

      <svg class="quizly-logo-icon" width="30" height="30"
        viewBox="0 0 32 32" fill="none"
        xmlns="http://www.w3.org/2000/svg">

        <rect width="32" height="32" rx="9"
          fill="url(#nav-quizly-grad)"/>

        <path
          d="M16 6.5C12.41 6.5 9.5 9.41 9.5 13C9.5 13.55 9.95 14 10.5 14C11.05 14 11.5 13.55 11.5 13C11.5 10.51 13.51 8.5 16 8.5C18.49 8.5 20.5 10.51 20.5 13C20.5 15.02 19.12 16.19 17.69 17.41C16.32 18.58 15 19.78 15 22C15 22.55 15.45 23 16 23C16.55 23 17 22.55 17 22C17 20.42 18.06 19.46 19.31 18.39C20.88 17.05 22.5 15.53 22.5 13C22.5 9.41 19.59 6.5 16 6.5ZM16 24.5C15.17 24.5 14.5 25.17 14.5 26C14.5 26.83 15.17 27.5 16 27.5C16.83 27.5 17.5 26.83 17.5 26C17.5 25.17 16.83 25.5 16 24.5Z"
          fill="white"/>

        <defs>
          <linearGradient id="nav-quizly-grad"
            x1="0" y1="0" x2="32" y2="32"
            gradientUnits="userSpaceOnUse">

            <stop stop-color="#8B5CF6"/>
            <stop offset="1" stop-color="#6D28D9"/>

          </linearGradient>
        </defs>

      </svg>

      <span class="logo">Quizly</span>
    </div>
  </nav>


  <main class="container">

    <div class="card quiz-card">

      <div class="quiz-header">

        <span class="user-badge" id="currentUserBadge">
          User: --
        </span>

        <span class="question-counter" id="questionCounter">
          Question 1 of 5
        </span>

      </div>


      <div class="question-section">

        <h2 class="question-text" id="questionText">
          Loading question...
        </h2>

        <div class="options-container" id="optionsContainer">
        </div>

      </div>


      <div class="quiz-footer">

        <button
          id="prevBtn"
          class="btn btn-secondary"
          onclick="handlePreviousQuestion()">
          Previous
        </button>

        <button
          id="nextBtn"
          class="btn btn-primary"
          onclick="handleNextQuestion()">
          Next
        </button>

        <button
          id="submitBtn"
          class="btn btn-success"
          style="display: none;"
          onclick="handleSubmitQuiz()">
          Submit Quiz
        </button>

      </div>

    </div>

  </main>


  <script src="script.js"></script>

</body>
</html>
